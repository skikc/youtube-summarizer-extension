<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YT Summary — YouTube 视频总结</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>YT Summary</h1>
    </div>

    <div class="api-key" id="apiKeySection">
        <div id="apiKeyInputGroup">
            <label>DeepSeek API Key</label>
            <div class="key-row">
                <input type="password" id="apiKey" placeholder="sk-...">
                <button id="saveKeyBtn" class="btn-sm">保存</button>
            </div>
            <small>前往 <a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a> 获取 Key</small>
        </div>
        <div id="apiKeyCollapsed" class="key-ready">
            <span>🔑 DeepSeek API Key 已就绪</span>
            <button id="editApiKeyBtn" class="btn-text">修改</button>
        </div>
    </div>

    <div class="actions">
        <button id="summarizeBtn" class="btn-primary">📝 总结当前视频</button>
        <button id="showTranscriptBtn" class="btn-secondary">📄 查看完整字幕</button>
    </div>

    <div class="options-row">
        <label class="deep-mode-label" title="合并阶段使用 DeepSeek V4 Pro，深度推理，适合复杂长视频">
            <input type="checkbox" id="deepMode">
            <span>🔬 深度模式</span>
        </label>
    </div>

    <div id="status"></div>
    <div id="summary"></div>

    <div class="transcript-section" id="transcriptSection" style="display:none;">
        <div class="transcript-header" id="transcriptToggle">
            <span>📋 原始字幕</span>
            <span class="toggle-icon">▲</span>
        </div>
        <textarea id="transcriptArea" placeholder="字幕内容将显示在这里..." readonly></textarea>
    </div>

    <script src="popup.js"></script>
</body>
</html>
