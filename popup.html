<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YT Summary - YouTube 视频总结</title>
    <style>
        body {
            width: 420px;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #f8f9fa;
        }
        h1 { margin-top: 0; text-align: center; color: #c00; }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #c00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #a00; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            min-height: 20px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        #summary {
            margin-top: 15px;
            white-space: pre-wrap;
            max-height: 420px;
            overflow-y: auto;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            line-height: 1.6;
        }
        .api-key { margin: 12px 0; }
        input[type="password"] { width: 100%; padding: 8px; }
        small { color: #666; }
    </style>
</head>
<body>
    <h1>YT Summary</h1>
    <p>使用 DeepSeek 总结 YouTube 视频</p>
    
    <div class="api-key" id="apiKeySection">
        <div id="apiKeyInputGroup">
            <label>DeepSeek API Key（必填）:</label><br>
            <div style="display:flex; gap:6px;">
                <input type="password" id="apiKey" placeholder="sk-..." style="flex:1; padding:8px;">
                <button id="saveKeyBtn" style="width:auto; padding:8px 12px; font-size:13px; white-space:nowrap;">保存</button>
            </div>
            <small>前往 <a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a> 获取 Key</small>
        </div>
        <div id="apiKeyCollapsed" style="display:none; align-items:center; justify-content:space-between; padding:8px 0;">
            <span style="color:#2e7d32; font-size:13px;">🔑 DeepSeek API Key 已就绪</span>
            <button id="editApiKeyBtn" style="width:auto; padding:4px 12px; font-size:12px; border:1px solid #ccc; background:#fff; color:#333;">修改</button>
        </div>
    </div>

    <button id="summarizeBtn">总结当前视频</button>
    <button id="showTranscriptBtn">显示完整字幕</button>
    
    <div id="status"></div>
    <div id="summary"></div>
    <textarea id="transcriptArea" placeholder="字幕内容将显示在这里..." style="width:100%; height:160px; margin-top:10px;"></textarea>

    <script src="popup.js"></script>
</body>
</html>
